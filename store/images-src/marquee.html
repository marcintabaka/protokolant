<!doctype html><html lang="pl"><head><meta charset="utf-8"><style>
  /* Transparent promocyjny Chrome Web Store (marquee) 1400x560 – w stylu małego kafelka tile.html */
  html, body { margin: 0; }
  body { width: 1400px; height: 560px; overflow: hidden; position: relative; font-family: 'Segoe UI', sans-serif; color: #fff;
    background: radial-gradient(circle at 78% 30%, rgba(145, 167, 255, .35) 0, rgba(145, 167, 255, 0) 45%), linear-gradient(135deg, #3B5BDB 0%, #2b3fa8 100%); }
  .text { position: absolute; left: 88px; top: 0; bottom: 0; width: 680px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 26px; margin-bottom: 30px; }
  .ic { width: 112px; height: 112px; background: #fff; border-radius: 26px; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
  .ic img { width: 98px; height: 98px; }
  h1 { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .tag { margin: 0 0 34px; font-size: 38px; line-height: 1.25; font-weight: 600; }
  .tag em { font-style: normal; color: #ffd8d8; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; }
  .pill { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 9px 20px 9px 14px; font-size: 21px; color: #fff; }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 4px rgba(255, 107, 107, .3); }
  .card { position: absolute; right: 88px; top: 64px; width: 504px; background: #fff; border-radius: 16px 16px 0 0; overflow: hidden;
    box-shadow: 0 24px 60px rgba(10, 20, 70, .45), 0 2px 8px rgba(10, 20, 70, .25); }
  .card img { display: block; width: 504px; }
</style></head><body>
  <div class="text">
    <div class="brand"><div class="ic"><img src="../../design/icons/B1/rec.svg"></div><h1>Protokolant</h1></div>
    <p class="tag">Transkrypcje spotkań Google&nbsp;Meet™ <em>po&nbsp;polsku</em></p>
    <div class="pills">
      <span class="pill"><i></i>Za darmo</span>
      <span class="pill"><i></i>Bez konta</span>
      <span class="pill"><i></i>Zapis na Twoim komputerze</span>
    </div>
  </div>
  <div class="card"><img src="out/popup-live.png"></div>
</body></html>
